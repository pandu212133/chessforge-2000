<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stockfish diagnostic</title><h2>Stockfish 18 diagnostic</h2><button onclick="run()">Run test</button><pre id="log" style="white-space:pre-wrap"></pre><script>async function run(){const l=document.getElementById('log');l.textContent='';const log=x=>l.textContent+=x+'\n';try{for(const f of ['stockfish-18-lite-single.js','stockfish-18-lite-single.wasm']){const r=await fetch(f+'?diagnostic=1',{cache:'reload'});const b=await r.arrayBuffer();log(f+': HTTP '+r.status+'; '+b.byteLength+' bytes; '+r.headers.get('content-type'));if(!r.ok)throw Error('File unavailable');if(f.endsWith('wasm')){log('WASM validation: '+WebAssembly.validate(b));}}const w=new Worker('./stockfish-18-lite-single.js?diagnostic=1');const timer=setTimeout(()=>{log('Timed out after 90 seconds');w.terminate()},90000);w.onerror=e=>{log('Worker error: '+e.message+' '+e.filename+':'+e.lineno);clearTimeout(timer);w.terminate()};w.onmessage=e=>{const s=String(e.data);log(s);if(s.includes('uciok'))w.postMessage('isready');if(s.includes('readyok')){w.postMessage('position startpos');w.postMessage('go depth 10')}if(s.includes('bestmove')){clearTimeout(timer);w.terminate();log('PASS: engine returned a best move')}};w.postMessage('uci')}catch(e){log(String(e))}}</script>
